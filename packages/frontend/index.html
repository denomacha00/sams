<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAMS — Smart Attendance Management System</title>
    <script>
      // Restore saved theme before paint to prevent flash
      (function() {
        var t = null;
        try { t = localStorage.getItem('sams-theme'); } catch(e) {}
        if (t === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
      })();
    </script>
    <style>
      html, body, #root { min-height: 100vh; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- QR Code Scanner Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <!-- Face Detection Library for Biometric Enrollment -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
